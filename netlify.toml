# Static site. No build step on Netlify: run `python build.py` locally and commit the output.
[build]
  publish = "."

[[redirects]]
  from = "/Jonathan_DiGiorgio_Resume.pdf"
  to = "/assets/docs/Jonathan_DiGiorgio_Resume.pdf"
  status = 301

[[redirects]]
  from = "/_src/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
